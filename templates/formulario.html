<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Consultante — Maru González</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased relative overflow-x-hidden my-8">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="glass-panel max-w-xl w-full p-6 md:p-8 rounded-3xl shadow-2xl space-y-6 relative z-10 border border-white/10">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 mx-auto flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-purple-500/30">M</div>
            <h1 class="text-xl md:text-2xl font-extrabold bg-gradient-to-r from-purple-300 via-pink-200 to-amber-200 bg-clip-text text-transparent">Ficha Astrológica de Consultante</h1>
            <p class="text-xs text-slate-400">Por favor ingresa tus datos con la mayor precisión posible</p>
        </div>

        <form action="/registro-form" method="POST">
            
            <!-- Nombre Completo -->
            <div class="space-y-1">
                <label for="nombre" class="text-xs font-semibold text-slate-300">Nombre Completo *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: María García" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <!-- WhatsApp y Correo -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label for="telefono" class="text-xs font-semibold text-slate-300">WhatsApp / Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+58 414 1234567" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="space-y-1">
                    <label for="email" class="text-xs font-semibold text-slate-300">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>

            <!-- Datos de Nacimiento -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1">
                    <label for="fecha_nacimiento" class="text-xs font-semibold text-slate-300">Fecha Nacimiento *</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="space-y-1">
                    <label for="hora_nacimiento" class="text-xs font-semibold text-slate-300">Hora Exacta</label>
                    <input type="time" id="hora_nacimiento" name="hora_nacimiento" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="space-y-1">
                    <label for="lugar_nacimiento" class="text-xs font-semibold text-slate-300">Ciudad/País</label>
                    <input type="text" id="lugar_nacimiento" name="lugar_nacimiento" placeholder="Ej: Caracas, VE" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-3 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>

            <!-- Referido por (NUEVO CAMPO) -->
            <div class="space-y-1">
                <label for="referido_por" class="text-xs font-semibold text-purple-300 flex items-center gap-1.5">
                    <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
                    <span>¿Llegaste por recomendación de alguien? (Opcional)</span>
                </label>
                <input type="text" id="referido_por" name="referido_por" placeholder="Ej: Ana Castro" class="w-full bg-slate-800/80 border border-purple-500/30 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>


            <!-- Selección de Todos los Servicios -->
            <div class="space-y-2 pt-2">
                <label class="text-xs font-semibold text-slate-300">Servicios de tu Interés (puedes seleccionar varios):</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Revolución Solar" class="accent-purple-600 rounded">
                        <span>Revolución Solar</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Carta Natal Evolutiva" class="accent-purple-600 rounded">
                        <span>Carta Natal Evolutiva</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Canalización" class="accent-purple-600 rounded">
                        <span>Canalización</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Sinastría de Pareja" class="accent-purple-600 rounded">
                        <span>Sinastría de Pareja</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Carta Compuesta" class="accent-purple-600 rounded">
                        <span>Carta Compuesta</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Tránsitos y Progresiones" class="accent-purple-600 rounded">
                        <span>Tránsitos y Progresiones</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Astrocartografía" class="accent-purple-600 rounded">
                        <span>Astrocartografía</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40">
                        <input type="checkbox" name="servicios" value="Revolución Lunar" class="accent-purple-600 rounded">
                        <span>Revolución Lunar</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800/50 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/40 md:col-span-2">
                        <input type="checkbox" name="servicios" value="Astrología Infantil" class="accent-purple-600 rounded">
                        <span>Astrología Infantil / Crianza Consciente</span>
                    </label>
                </div>
            </div>

            <!-- Motivo de Consulta -->
            <div class="space-y-1">
                <label for="motivo_consulta" class="text-xs font-semibold text-slate-300">Motivo o inquietud principal</label>
                <textarea id="motivo_consulta" name="motivo_consulta" rows="2" placeholder="Cuéntame brevemente qué te gustaría profundizar en la sesión..." class="w-full bg-slate-800/80 border border-white/10 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
            </div>

            <!-- Contraseña para su Portal -->
            <div class="space-y-1">
                <label for="password" class="text-xs font-semibold text-slate-300">Crea una Contraseña para tu Portal Privado *</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full bg-slate-800/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <!-- Botón Submit -->
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-600/30 text-xs mt-4 flex items-center justify-center gap-2">
                <span>Completar Registro</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

        </form>

        <div class="text-center border-t border-white/10 pt-4">
            <a href="/" class="text-xs text-purple-300 hover:text-purple-200 font-semibold transition">
                ← Volver a la página principal
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
