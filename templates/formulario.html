<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Registro — Maru González</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-4 md:p-8 antialiased selection:bg-purple-500 selection:text-white relative flex justify-center items-center">

    <!-- Background Neon -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="max-w-2xl w-full my-8 relative z-10">
        
        <div class="glass-panel p-6 md:p-10 rounded-3xl shadow-2xl space-y-6 border border-white/10">
            
            <!-- Header Formulario -->
            <div class="text-center space-y-2">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-purple-500/20">
                    M
                </div>
                <h1 class="text-2xl font-extrabold bg-gradient-to-r from-purple-300 via-pink-200 to-amber-200 bg-clip-text text-transparent">
                    Ficha Astrológica de Consultante
                </h1>
                <p class="text-xs text-slate-400 font-medium">
                    Por favor ingresa tus datos con la mayor precisión posible
                </p>
            </div>

            <!-- Mensajes Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="p-4 rounded-2xl text-xs font-semibold border flex items-center gap-3 shadow-xl {% if category == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-300{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-300{% endif %}">
                    <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                    <span>{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- FORMULARIO SIN AUTOCOMPLETADO NI CAMPO DE CONTRASEÑA -->
            <form action="/registro-form" method="POST" autocomplete="off" class="space-y-4">
                
                <!-- Nombre Completo -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Nombre Completo *</label>
                    <input type="text" name="nombre" required placeholder="Ej: María García" autocomplete="off"
                           class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
                </div>

                <!-- Contacto: WhatsApp y Correo -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">WhatsApp / Teléfono *</label>
                        <input type="text" name="telefono" required placeholder="+58 414 1234567" autocomplete="off"
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Correo Electrónico *</label>
                        <input type="email" name="email" required placeholder="tu@email.com" autocomplete="off"
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
                    </div>
                </div>

                <!-- Datos Nacimiento -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Fecha Nacimiento *</label>
                        <input type="date" name="fecha_nacimiento" required
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-purple-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Hora Exacta</label>
                        <input type="time" name="hora_nacimiento"
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-purple-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Ciudad/País</label>
                        <input type="text" name="lugar_nacimiento" placeholder="Ej: Caracas, VE" autocomplete="off"
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
                    </div>
                </div>

                <!-- Referido -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">¿Llegaste por recomendación de alguien? (Opcional)</label>
                    <input type="text" name="referido_por" placeholder="Ej: Ana Castro" autocomplete="off"
                           class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
                </div>

                <!-- Servicios -->
                <div class="pt-2">
                    <label class="block text-xs font-bold text-slate-300 mb-2">Servicios de tu Interés (puedes seleccionar varios):</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Revolución Solar" class="accent-purple-600 rounded">
                            <span>Revolución Solar</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Carta Natal Evolutiva" class="accent-purple-600 rounded">
                            <span>Carta Natal Evolutiva</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Canalización" class="accent-purple-600 rounded">
                            <span>Canalización</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Sinastría de Pareja" class="accent-purple-600 rounded">
                            <span>Sinastría de Pareja</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Carta Compuesta" class="accent-purple-600 rounded">
                            <span>Carta Compuesta</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Tránsitos y Progresiones" class="accent-purple-600 rounded">
                            <span>Tránsitos y Progresiones</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Astrocartografía" class="accent-purple-600 rounded">
                            <span>Astrocartografía</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-xl border border-white/5 cursor-pointer hover:border-purple-500/30 transition">
                            <input type="checkbox" name="servicios" value="Revolución Lunar" class="accent-purple-600 rounded">
                            <span>Revolución Lunar</span>
                        </label>
                    </div>
                </div>

                <!-- Motivo -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Motivo o inquietud principal</label>
                    <textarea name="motivo_consulta" rows="3" placeholder="Cuéntame brevemente qué te gustaría profundizar en la sesión..."
                              class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"></textarea>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-600/30 text-xs mt-4">
                    Completar Registro y Abrir Mi Portal ✨
                </button>

            </form>

        </div>

    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
