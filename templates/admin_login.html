<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo — Maru González</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-box {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Efecto Neón de Fondo -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md w-full glass-box p-8 rounded-3xl shadow-2xl space-y-6 relative z-10">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-xl mx-auto shadow-lg shadow-purple-500/30">M</div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Acceso Administrativo</h1>
            <p class="text-xs text-slate-400">Maru González — Astrología Evolutiva</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 rounded-xl text-xs bg-rose-500/10 border border-rose-500/30 text-rose-300 font-semibold text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Usuario Administrator</label>
                <div class="relative">
                    <input type="text" name="usuario" required placeholder="admin" class="w-full bg-slate-900/80 border border-white/10 rounded-xl p-3 pl-10 text-xs text-white focus:outline-none focus:border-purple-400">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-white/10 rounded-xl p-3 pl-10 text-xs text-white focus:outline-none focus:border-purple-400">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                </div>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-600/30 text-xs">
                Iniciar Sesión
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-slate-400 hover:text-white transition">← Volver al sitio público</a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
